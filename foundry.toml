[profile.default]
libs = ["lib"]
via-ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
evm_version = "cancun"

[rpc_endpoints]
# Full Ethereum mainnet RPC URL, e.g. a Chainstack node endpoint (see .env.example).
mainnet = "${MAINNET_RPC_URL}"
tenderly = "https://rpc.tenderly.co/fork/${TENDERLY_FORK_ID}"

[profile.default.fmt]
wrap_comments = true

[lint]
exclude_lints = [
    "unaliased-plain-import",
    "unused-import",
    "erc20-unchecked-transfer",
    "unwrapped-modifier-logic",
    "mixed-case-variable",
    "unsafe-typecast",
    "asm-keccak256",
    "block-timestamp",
]
